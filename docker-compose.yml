networks:
  backend-network:
    driver: bridge
  frontend-network:
    driver: bridge
  shared-network:
    driver: bridge

x-backend-env: &backend-env
  DB_HOST: ${DB_HOST}
  DB_PORT: ${DB_PORT}
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}
  DB_NAME: ${DB_NAME}
  REDIS_HOST: ${REDIS_HOST}
  REDIS_PORT: 6379
  ENABLE_GPT_5_1: ${ENABLE_GPT_5_1:-False}
  ANOMALY_LLM_PROVIDER: ${ANOMALY_LLM_PROVIDER:-disabled}
  LLM_API_KEY: ${LLM_API_KEY}
  LLM_BASE_URL: ${LLM_BASE_URL}
  LLM_MODEL: ${LLM_MODEL}
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
  NEWS_PROVIDER: ${NEWS_PROVIDER:-auto}
  NEWS_API_KEY: ${NEWS_API_KEY}
  NEWS_API_BASE_URL: ${NEWS_API_BASE_URL}
  NEWS_API_TIMEOUT_SECONDS: ${NEWS_API_TIMEOUT_SECONDS:-12}
  NEWS_ENABLE_BINANCE_ANNOUNCEMENTS: ${NEWS_ENABLE_BINANCE_ANNOUNCEMENTS:-True}
  NEWS_BINANCE_ARTICLE_LIST_URL: ${NEWS_BINANCE_ARTICLE_LIST_URL:-https://www.binance.com/bapi/composite/v1/public/cms/article/list/query}
  NEWS_BINANCE_ARTICLE_PAGE_SIZE: ${NEWS_BINANCE_ARTICLE_PAGE_SIZE:-3}
  NEWS_BINANCE_CATALOG_LIMIT: ${NEWS_BINANCE_CATALOG_LIMIT:-8}
  NEWS_ENABLE_OKX_ANNOUNCEMENTS: ${NEWS_ENABLE_OKX_ANNOUNCEMENTS:-True}
  NEWS_OKX_ANNOUNCEMENTS_URL: ${NEWS_OKX_ANNOUNCEMENTS_URL:-https://www.okx.com/help/section/announcements-new-listings}
  NEWS_ENABLE_BYBIT_ANNOUNCEMENTS: ${NEWS_ENABLE_BYBIT_ANNOUNCEMENTS:-True}
  NEWS_BYBIT_ANNOUNCEMENTS_URL: ${NEWS_BYBIT_ANNOUNCEMENTS_URL:-https://announcements.bybit.com/en-US/}
  NEWS_ENABLE_COINBASE_BLOG: ${NEWS_ENABLE_COINBASE_BLOG:-True}
  NEWS_COINBASE_BLOG_URL: ${NEWS_COINBASE_BLOG_URL:-https://www.coinbase.com/blog/landing}
  NEWS_OFFICIAL_PAGE_ITEM_LIMIT: ${NEWS_OFFICIAL_PAGE_ITEM_LIMIT:-12}
  NEWS_RSS_FEED_URLS: ${NEWS_RSS_FEED_URLS:-https://www.coindesk.com/arc/outboundfeeds/rss/,https://cointelegraph.com/rss,https://www.panewslab.com/zh/rss/newsflash.xml,https://decrypt.co/feed,https://blockworks.co/feed,https://www.theblock.co/rss.xml,https://cryptoslate.com/feed/,https://bitcoinmagazine.com/feed,https://thedefiant.io/feed,https://ambcrypto.com/feed/,https://coingape.com/feed/,https://news.bitcoin.com/feed/}
  NEWS_RSS_CACHE_SECONDS: ${NEWS_RSS_CACHE_SECONDS:-180}
  NEWS_RSS_PER_FEED_LIMIT: ${NEWS_RSS_PER_FEED_LIMIT:-12}
  NEWS_GLOBAL_POOL_SIZE: ${NEWS_GLOBAL_POOL_SIZE:-80}
  NEWS_RSS_MAX_AGE_HOURS: ${NEWS_RSS_MAX_AGE_HOURS:-72}
  NEWS_SEARCH_CACHE_SECONDS: ${NEWS_SEARCH_CACHE_SECONDS:-600}
  NEWS_SEARCH_EMPTY_CACHE_SECONDS: ${NEWS_SEARCH_EMPTY_CACHE_SECONDS:-180}
  NEWS_SYMBOL_ALIAS_MAP: ${NEWS_SYMBOL_ALIAS_MAP:-}
  NEWS_SYMBOL_OFFICIAL_FEEDS: ${NEWS_SYMBOL_OFFICIAL_FEEDS:-}
  NEWS_SYMBOL_OFFICIAL_FEED_CACHE_SECONDS: ${NEWS_SYMBOL_OFFICIAL_FEED_CACHE_SECONDS:-900}
  ANOMALY_SCAN_INTERVAL: ${ANOMALY_SCAN_INTERVAL:-300}
  ANOMALY_TOP_N: ${ANOMALY_TOP_N:-100}
  ANOMALY_CANDIDATE_LIMIT: ${ANOMALY_CANDIDATE_LIMIT:-12}
  ANOMALY_ALERT_THRESHOLD: ${ANOMALY_ALERT_THRESHOLD:-0.58}
  ANOMALY_COOLDOWN_MINUTES: ${ANOMALY_COOLDOWN_MINUTES:-30}
  ANOMALY_NEWS_LIMIT: ${ANOMALY_NEWS_LIMIT:-6}
  MARKET_INSIGHT_NOTIFY_SCAN_INTERVAL: ${MARKET_INSIGHT_NOTIFY_SCAN_INTERVAL:-60}

services:
  redis:
    image: redis:6-alpine
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend-network
      - shared-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    networks:
      - backend-network
      - shared-network
    restart: always
    ports:
      - "8029:8000"
    environment:
      <<: *backend-env
      START_MARKET_POLLER: "True"
      START_POSITION_SYNC: "True"
      START_ANOMALY_MONITOR: "False"
      START_MARKET_INSIGHT_NOTIFIER: "False"
      START_POLYMARKET_TRADER_CACHE: "False"
      START_POLYMARKET_COPY_RUNNER: "True"
    depends_on:
      redis:
        condition: service_healthy

  insight-worker:
    build:
      context: .
      dockerfile: Dockerfile
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    networks:
      - backend-network
      - shared-network
    restart: always
    environment:
      <<: *backend-env
      START_MARKET_POLLER: "False"
      START_POSITION_SYNC: "False"
      START_ANOMALY_MONITOR: "True"
      START_MARKET_INSIGHT_NOTIFIER: "True"
      START_POLYMARKET_TRADER_CACHE: "False"
      START_POLYMARKET_COPY_RUNNER: "False"
    depends_on:
      redis:
        condition: service_healthy

  polymarket-worker:
    build:
      context: .
      dockerfile: Dockerfile
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    networks:
      - backend-network
      - shared-network
    restart: always
    environment:
      <<: *backend-env
      START_MARKET_POLLER: "False"
      START_POSITION_SYNC: "False"
      START_ANOMALY_MONITOR: "False"
      START_MARKET_INSIGHT_NOTIFIER: "False"
      START_POLYMARKET_TRADER_CACHE: "True"
      START_POLYMARKET_COPY_RUNNER: "False"
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
        - API_URL=/api/v1
    restart: always
    ports:
      - "8030:80"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks:
      - frontend-network
      - shared-network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3


volumes:
  redis_data:
