<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>TradeHelper - 数字货币合约交易智能风控系统</title>
    <meta name="description" content="TradeHelper 是专业的数字货币合约交易风控平台，支持 Binance/OKX 多交易所实时监控，AI 驱动的市场异动检测与重大利好叙事识别，为交易者提供全方位的风险管控与决策辅助。">
    <meta name="keywords" content="数字货币风控,合约交易风控,加密货币风险监控,交易异动检测,Binance风控,OKX风控,AI交易分析,叙事检测">
    <meta property="og:title" content="TradeHelper - 数字货币合约交易智能风控系统">
    <meta property="og:description" content="实时监控多交易所持仓，智能识别市场异动与重大利好叙事，AI 辅助决策，为您的数字资产提供全方位的风控保障。">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="TradeHelper - 数字货币合约交易智能风控系统">
    <meta name="twitter:description" content="实时监控多交易所持仓，智能识别市场异动与重大利好叙事，AI 辅助决策。">
    <!-- Preload fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        #app {
            height: 100vh;
        }
        .app-loading {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f0f2f5;
        }
        .app-loading__content {
            text-align: center;
        }
        .app-loading__spinner {
            width: 50px;
            height: 50px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #409eff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        .app-loading__text {
            color: #606266;
            font-size: 16px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="app-loading">
            <div class="app-loading__content">
                <div class="app-loading__spinner"></div>
                <div class="app-loading__text">系统加载中...</div>
            </div>
        </div>
    </div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
