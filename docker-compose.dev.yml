services:
  mysql:
    image: mysql:8.0
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend-network
      - shared-network
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    volumes:
      - .:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    depends_on: !override
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  insight-worker:
    volumes:
      - .:/app
    command: python scripts/run_anomaly_worker.py
    depends_on: !override
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql_data:
